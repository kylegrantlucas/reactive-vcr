[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kylegrantlucas/reactive-vcr"
homepage = "https://kylegrantlucas.github.io/reactive-vcr/"
publish = false

[workspace.dependencies]
reactive-vcr = { path = "crates/reactive-vcr" }
reactive-vcr-gst = { path = "crates/reactive-vcr-gst" }
anyhow = "1.0.104"
bender = { git = "https://github.com/kylegrantlucas/bender-rs", rev = "e5b754c2bbea7ab924c078f857241c7a23c17ea1", version = "0.2.0" }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37", features = ["persistence"] }
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-base = "0.25.4"
gstreamer-pbutils = "0.25.4"
gstreamer-video = "0.25.4"
ntsc-rs = { git = "https://github.com/ntsc-rs/ntsc-rs", rev = "88f2df9a27863097eaffd8d1fe0080a174dfd4a5", version = "0.1.2", features = ["rayon"] }
parking_lot = "0.12.5"
realfft = "3.5.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
