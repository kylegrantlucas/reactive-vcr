# A worn long-play tape loses color in rhythmic horizontal bands.
[base]
preset = "../assets/base.json"
seed = 42

[audio]
bands.bass = [20, 160]
bands.mid = [250, 1800]
bands.air = [3000, 14000]
normalize = "peak"
onset_sensitivity = 1.35

[[modulate]]
target = "vhs_settings"
source = "rms"
threshold = 0.0

[[modulate]]
target = "vhs_tape_speed"
source = "rms"
range = [2, 2]

[[modulate]]
target = "vhs_chroma_loss"
source = "onset"
range = [0, 0.95]
release_ms = 130

[[modulate]]
target = "vhs_edge_wave_enabled"
source = "rms"
threshold = 0.0

[[modulate]]
target = "vhs_edge_wave"
source = "band:bass"
range = [0, 4]
curve = "pow:6"
release_ms = 150

[[modulate]]
target = "head_switching"
source = "onset"
threshold = 0.5
release_ms = 90

[[modulate]]
target = "head_switching_height"
source = "rms"
range = [20, 20]

[[modulate]]
target = "head_switching_horizontal_shift"
source = "rms"
range = [30, 30]
