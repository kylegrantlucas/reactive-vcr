# Bass rolls the picture and drum hits tear the sync before the signal reaches tape.
[base]
preset = "../assets/base.json"
seed = 42

[audio]
bands.bass = [20, 160]
bands.mid = [250, 1800]
bands.air = [3000, 14000]
normalize = "peak"
onset_sensitivity = 1.35

[bender]
order = "before"
seed = 3

[bender.set]
"sync.enabled" = true
"sync.h_jitter" = 0.0
"rail.enabled" = true
"rail.sag" = 0.2

[[modulate]]
target = "bender.sync.v_roll"
source = "band:bass"
range = [0.0, 0.6]
curve = "pow:4"
release_ms = 220

[[modulate]]
target = "bender.sync.tear_rate"
source = "onset"
range = [0.0, 1.0]
release_ms = 120

[[modulate]]
target = "bender.sync.h_jitter"
source = "onset"
range = [0.0, 0.06]
release_ms = 90

[[modulate]]
target = "bender.rail.hum"
source = "rms"
range = [0.0, 0.6]
curve = "pow:2"
release_ms = 300

[[modulate]]
target = "bender.rail.streak"
source = "band:air"
range = [0.0, 0.7]
release_ms = 150
