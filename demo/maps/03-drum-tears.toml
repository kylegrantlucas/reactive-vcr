# Detected attacks trigger sharp horizontal tears and quick tape wobble.
[base]
preset = "../assets/base.json"
seed = 42

[audio]
bands.bass = [20, 160]
bands.mid = [250, 1800]
bands.air = [3000, 14000]
normalize = "peak"
onset_sensitivity = 1.35

[[modulate]]
target = "tracking_noise"
source = "onset"
threshold = 0.45
release_ms = 65

[[modulate]]
target = "tracking_noise_height"
source = "rms"
range = [100, 100]

[[modulate]]
target = "tracking_noise_wave_intensity"
source = "onset"
range = [0, -48]
release_ms = 75

[[modulate]]
target = "tracking_noise_noise_intensity"
source = "rms"
range = [0.08, 0.08]

[[modulate]]
target = "head_switching"
source = "onset"
threshold = 0.4
release_ms = 80

[[modulate]]
target = "head_switching_height"
source = "rms"
range = [24, 24]

[[modulate]]
target = "head_switching_horizontal_shift"
source = "onset"
range = [0, 95]
release_ms = 90

[[modulate]]
target = "vhs_settings"
source = "rms"
threshold = 0.0

[[modulate]]
target = "vhs_edge_wave_enabled"
source = "rms"
threshold = 0.0

[[modulate]]
target = "vhs_edge_wave"
source = "onset"
range = [0, 12]
release_ms = 70
