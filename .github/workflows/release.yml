name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Match tag to package version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}"

  licenses:
    name: Bundle third-party licenses
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Generate license bundle
        run: |
          cargo install --locked cargo-about --version 0.9.2
          cargo about generate --output-file THIRD_PARTY_LICENSES.html about.hbs
          test -s THIRD_PARTY_LICENSES.html
          grep --quiet 'ntsc-rs' THIRD_PARTY_LICENSES.html

      - name: Upload license bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, licenses]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download license bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: third-party-licenses

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke-test binary
        run: |
          binary="target/${{ matrix.target }}/release/reactive-vcr"
          "${binary}" --version
          "${binary}" params >/dev/null

      - name: Package archive
        run: |
          archive="reactive-vcr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${archive}"
          cp "target/${{ matrix.target }}/release/reactive-vcr" "dist/${archive}/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.html "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --title "reactive-vcr ${GITHUB_REF_NAME}"
          --generate-notes
