[package]
name = "reactive-vcr-gst"
description = "GStreamer decoding, playback, preview, and rendering for reactive-vcr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
reactive-vcr.workspace = true
anyhow.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-base.workspace = true
gstreamer-pbutils.workspace = true
gstreamer-video.workspace = true
parking_lot.workspace = true

# GStreamer video sinks on macOS need gst_macos_main (GStreamer 1.22+) to own the main thread.
[target.'cfg(target_os = "macos")'.dependencies]
gstreamer = { workspace = true, features = ["v1_22"] }

[dev-dependencies]
tempfile.workspace = true
